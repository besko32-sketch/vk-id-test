<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VK ID Test</title>
</head>
<body>

<div id="vkid"></div>

<script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>

<script>
const VKID = window.VKIDSDK;

VKID.Config.init({
    app: 54600926,
    redirectUrl: 'https://oauth.vk.com/blank.html',
    responseMode: VKID.ConfigResponseMode.Callback,
    source: VKID.ConfigSource.LOWCODE,
    scope: ''
});

const oneTap = new VKID.OneTap();

oneTap.render({
    container: document.getElementById('vkid'),
    showAlternativeLogin: true
})
.on(VKID.WidgetEvents.ERROR, console.error)
.on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function(payload) {

    console.log("LOGIN SUCCESS");
    console.log("CODE:", payload.code);
    console.log("DEVICE ID:", payload.device_id);

    VKID.Auth.exchangeCode(payload.code, payload.device_id)
        .then(function(data) {
            console.log("VK RESPONSE:", data);
        })
        .catch(function(error) {
            console.error("EXCHANGE ERROR:", error);
        });
})
.on(VKID.WidgetEvents.ERROR, function(error) {
    console.error("VKID ERROR:", error);
});
</script>

</body>
</html>
